[project]
name = "tse-fetcher"
version = "0.1.0"
description = "Coletor de dados eleitorais do TSE (Tribunal Superior Eleitoral)"
readme = "README.md"
authors = [
    { name = "Komesu, D.K.", email = "daniel@dkko.me" },
]
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = [
    "tse",
    "eleicoes",
    "candidatos",
    "votacao",
    "brazil",
    "open-data",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "Intended Audience :: Science/Research",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Utilities",
    "Typing :: Typed",
]
dependencies = [
    "quantilica-core>=0.8.0",
]

[project.urls]
Homepage = "https://github.com/Quantilica/tse-fetcher"
Repository = "https://github.com/Quantilica/tse-fetcher"
Issues = "https://github.com/Quantilica/tse-fetcher/issues"

[project.scripts]
tse-fetcher = "tse_fetcher.cli:main"

[project.entry-points."quantilica.fetchers"]
tse = "tse_fetcher.plugin:app"

[dependency-groups]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["-p", "no:cacheprovider"]

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.hatch.build.targets.wheel]
packages = ["src/tse_fetcher"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"
